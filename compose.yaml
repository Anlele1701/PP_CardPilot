services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-cardpilot}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-cardpilot}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-cardpilot}
    ports:
      - '${LOCAL_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ocr:
    profiles: ['ocr']
    platform: linux/amd64
    image: cardpilot-ocr-service:local
    build:
      context: apps/cardpilot-ocr-service
      args:
        DOWNLOAD_MODELS: ${OCR_DOWNLOAD_MODELS:-1}
    init: true
    environment:
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_DEFAULT_CURRENCY: ${OCR_DEFAULT_CURRENCY:-VND}
      OCR_MODEL_DIR: ${OCR_MODEL_DIR:-models}
    ports:
      - '${LOCAL_OCR_PORT:-8080}:8080'

volumes:
  postgres_data:
    name: cardpilot_postgres_data
