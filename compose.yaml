services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-cardpilot}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-cardpilot}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-cardpilot}
    ports:
      - '${LOCAL_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: cardpilot_postgres_data
