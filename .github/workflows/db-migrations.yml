name: Run DB Migrations

on:
  push:
    branches: [ "develop" ]
    paths:
      - "apps/cardpilot-backend/src/database/migrations/**"
      - "apps/cardpilot-backend/src/database/data-source.ts"
      - "package.json"
      - "pnpm-lock.yaml"

  workflow_dispatch:

concurrency:
  group: supabase-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm nx build cardpilot-backend

      - name: Run pending migrations
        run: pnpm migration:run
