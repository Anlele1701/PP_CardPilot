name: Backend Check

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, and build backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm nx run cardpilot-backend:lint

      - name: Test backend
        run: pnpm nx run cardpilot-backend:test

      - name: Build backend
        run: pnpm nx run cardpilot-backend:build
