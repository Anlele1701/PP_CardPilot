name: Flutter Analyze

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: flutter-analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Flutter workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Flutter dependencies
        run: pnpm nx run-many -t pub-get -p cardpilot-ui,cardpilot-widgetbook,cardpilot-app

      - name: Generate Widgetbook metadata
        working-directory: apps/cardpilot-mobile/apps/cardpilot_widgetbook
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter projects
        run: pnpm nx run-many -t analyze -p cardpilot-ui,cardpilot-widgetbook,cardpilot-app
